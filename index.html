<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinity AI ∞</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0d10;
      --sidebar: #101318;
      --panel: #151922;
      --panel-hover: #1b202a;
      --border: #272d38;
      --text: #f4f7fb;
      --muted: #9aa3b2;
      --accent: #7c8cff;
      --accent2: #a78bfa;
      --user: #252b36;
      --danger: #ff6b6b;
      --input: #171b23;
    }

    body.light {
      --bg: #f7f8fa;
      --sidebar: #ffffff;
      --panel: #ffffff;
      --panel-hover: #f0f2f5;
      --border: #dfe3e8;
      --text: #111318;
      --muted: #667085;
      --user: #e9edf2;
      --input: #ffffff;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* APP */

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* SIDEBAR */

    .sidebar {
      width: 260px;
      min-width: 260px;
      height: 100vh;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 8px 18px;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      font-size: 25px;
      font-weight: 800;
    }

    .brand-text {
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -0.4px;
    }

    .new-chat {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 11px 13px;
      border-radius: 12px;
      text-align: left;
      transition: 0.2s;
      margin-bottom: 14px;
    }

    .new-chat:hover {
      background: var(--panel-hover);
    }

    .nav-title {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 8px 9px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav button {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 10px 11px;
      border-radius: 10px;
      text-align: left;
      transition: 0.2s;
    }

    .nav button:hover,
    .nav button.active {
      background: var(--panel-hover);
      color: var(--text);
    }

    .recent {
      margin-top: 15px;
      overflow: auto;
      flex: 1;
    }

    .recent-chat {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--muted);
      text-align: left;
      padding: 9px 10px;
      border-radius: 9px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-chat:hover {
      background: var(--panel-hover);
      color: var(--text);
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 10px;
    }

    .creator {
      padding: 9px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    /* MAIN */

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .topbar {
      height: 60px;
      min-height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bg);
    }

    .mode-name {
      font-weight: 650;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: 10px;
    }

    .icon-btn:hover {
      background: var(--panel-hover);
    }

    /* CHAT */

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 25px 20px 150px;
    }

    .chat-content {
      width: min(900px, 100%);
      margin: auto;
    }

    /* WELCOME */

    .welcome {
      min-height: calc(100vh - 230px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .welcome-logo {
      font-size: 55px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .welcome h1 {
      font-size: clamp(30px, 5vw, 45px);
      letter-spacing: -1.5px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: var(--muted);
      margin-bottom: 28px;
    }

    .quick-grid {
      width: min(760px, 100%);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .quick-card {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 14px;
      padding: 15px;
      text-align: left;
      transition: 0.2s;
    }

    .quick-card:hover {
      transform: translateY(-1px);
      background: var(--panel-hover);
    }

    .quick-card strong {
      display: block;
      margin-bottom: 4px;
    }

    .quick-card span {
      color: var(--muted);
      font-size: 13px;
    }

    /* MESSAGES */

    .message {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    .avatar {
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 750;
      font-size: 13px;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .message.user .avatar {
      background: var(--user);
    }

    .message-body {
      min-width: 0;
      flex: 1;
    }

    .message-name {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .message-text {
      line-height: 1.65;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .message.user .message-text {
      background: var(--user);
      padding: 11px 14px;
      border-radius: 13px;
      display: inline-block;
    }

    .message-actions {
      display: flex;
      gap: 6px;
      margin-top: 9px;
    }

    .message-actions button {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 6px;
    }

    .message-actions button:hover {
      color: var(--text);
    }

    /* TYPING */

    .typing {
      display: flex;
      gap: 5px;
      padding: 7px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      40% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* COMPOSER */

    .composer-wrap {
      position: absolute;
      bottom: 0;
      left: 260px;
      right: 0;
      padding: 15px 20px 20px;
      background: linear-gradient(
        transparent,
        var(--bg) 30%
      );
    }

    .composer {
      width: min(900px, 100%);
      margin: auto;
      border: 1px solid var(--border);
      background: var(--input);
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }

    .tools {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 10px 0;
      flex-wrap: wrap;
    }

    .tool {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 12px;
    }

    .tool:hover,
    .tool.active {
      background: var(--panel-hover);
      color: var(--text);
      border-color: var(--border);
    }

    .textarea {
      width: 100%;
      min-height: 54px;
      max-height: 180px;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      padding: 13px 14px;
      font-size: 15px;
      line-height: 1.5;
    }

    .textarea::placeholder {
      color: var(--muted);
    }

    .composer-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px 10px;
    }

    .mode-info {
      color: var(--muted);
      font-size: 11px;
    }

    .send {
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      font-size: 17px;
    }

    .send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* IMAGE PREVIEW */

    .image-preview {
      display: none;
      padding: 8px 12px;
      border-top: 1px solid var(--border);
    }

    .image-preview img {
      max-width: 160px;
      max-height: 100px;
      border-radius: 9px;
      display: block;
    }

    /* MOBILE */

    .mobile-menu {
      display: none;
    }

    @media (max-width: 760px) {
      .sidebar {
        position: fixed;
        z-index: 20;
        left: -270px;
        transition: 0.25s;
      }

      .sidebar.open {
        left: 0;
      }

      .mobile-menu {
        display: block;
      }

      .composer-wrap {
        left: 0;
      }

      .quick-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding: 0 12px;
      }

      .chat-area {
        padding-left: 12px;
        padding-right: 12px;
      }

      .composer-wrap {
        padding-left: 10px;
        padding-right: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <div class="logo">∞</div>
        <div class="brand-text">Infinity AI</div>
      </div>

      <button class="new-chat" onclick="newChat()">
        ＋ New chat
      </button>

      <div class="nav-title">Workspace</div>

      <div class="nav">

        <button class="active" onclick="setMode('Chat', this)">
          💬 Chat
        </button>

        <button onclick="setMode('Study', this)">
          🎓 Study
        </button>

        <button onclick="setMode('Research', this)">
          🔎 Research
        </button>

        <button onclick="setMode('Create', this)">
          ✨ Create
        </button>

        <button onclick="setMode('Code', this)">
          💻 Code
        </button>

        <button onclick="setMode('Images', this)">
          🖼️ Images
        </button>

        <button onclick="setMode('Canvas', this)">
          📝 Canvas
        </button>

      </div>

      <div class="recent">

        <div class="nav-title">
          Recent chats
        </div>

        <div id="recentChats"></div>

      </div>

      <div class="sidebar-bottom">

        <button class="nav" style="width:100%">
          <button onclick="toggleTheme()">
            ◐ Appearance
          </button>

          <button onclick="showSettings()">
            ⚙ Settings
          </button>
        </button>

        <div class="creator">
          Created by Luis Gabriel Marino
        </div>

      </div>

    </aside>

    <!-- MAIN -->

    <main class="main">

      <header class="topbar">

        <div style="display:flex;align-items:center;gap:10px">

          <button
            class="icon-btn mobile-menu"
            onclick="toggleSidebar()"
          >
            ☰
          </button>

          <div class="mode-name" id="modeName">
            Chat
          </div>

        </div>

        <div class="top-actions">

          <button
            class="icon-btn"
            onclick="shareChat()"
            title="Share"
          >
            ↗
          </button>

          <button
            class="icon-btn"
            onclick="showSettings()"
            title="Settings"
          >
            ⚙
          </button>

        </div>

      </header>

      <section class="chat-area" id="chatArea">

        <div class="chat-content" id="chatContent">

          <div class="welcome" id="welcome">

            <div class="welcome-logo">∞</div>

            <h1>Hey 👋 I'm Infinity AI</h1>

            <p>
              Your intelligent AI workspace for studying,
              research, creativity and more.
            </p>

            <div class="quick-grid">

              <button
                class="quick-card"
                onclick="usePrompt('Explain this topic to me like I am in Year 10.')"
              >
                <strong>🎓 Study</strong>
                <span>
                  Learn difficult topics in a simple way.
                </span>
              </button>

              <button
                class="quick-card"
                onclick="usePrompt('Help me research this topic and organize the important information.')"
              >
                <strong>🔎 Research</strong>
                <span>
                  Understand topics and organize information.
                </span>
              </button>

              <button
                class="quick-card"
                onclick="usePrompt('Help me create a creative idea for this project.')"
              >
                <strong>✨ Create</strong>
                <span>
                  Brainstorm ideas and create content.
                </span>
              </button>

              <button
                class="quick-card"
                onclick="usePrompt('Help me write clean and professional code.')"
              >
                <strong>💻 Code</strong>
                <span>
                  Build, debug and understand code.
                </span>
              </button>

            </div>

          </div>

        </div>

      </section>

    </main>

  </div>

  <!-- COMPOSER -->

  <div class="composer-wrap">

    <div class="composer">

      <div class="tools">

        <button
          class="tool"
          onclick="document.getElementById('imageInput').click()"
        >
          ＋ Attach
        </button>

        <button
          class="tool"
          onclick="setMode('Images')"
        >
          🖼️ Image
        </button>

        <button
          class="tool"
          onclick="setMode('Research')"
        >
          🔎 Search
        </button>

        <button
          class="tool"
          onclick="setMode('Think')"
        >
          🧠 Think
        </button>

        <button
          class="tool"
          onclick="setMode('Canvas')"
        >
          📝 Canvas
        </button>

        <button
          class="tool"
          onclick="startVoice()"
        >
          🎙️ Voice
        </button>

      </div>

      <div
        class="image-preview"
        id="imagePreview"
      ></div>

      <textarea
        id="messageInput"
        class="textarea"
        placeholder="Message Infinity AI..."
        rows="1"
        onkeydown="handleKey(event)"
      ></textarea>

      <div class="composer-bottom">

        <div class="mode-info">
          ∞ Infinity AI · <span id="composerMode">Chat</span>
        </div>

        <button
          class="send"
          id="sendButton"
          onclick="send()"
        >
          ↑
        </button>

      </div>

    </div>

  </div>

  <input
    type="file"
    id="imageInput"
    accept="image/*"
    style="display:none"
    onchange="previewImage(event)"
  />

  <script>

    /* =========================
       STATE
    ========================= */

    const state = {
      messages: [],
      mode: "Chat",
      image: null
    };

    let chatHistory =
      JSON.parse(
        localStorage.getItem("infinity_ai_chats") || "[]"
      );

    /* =========================
       ELEMENTS
    ========================= */

    const input =
      document.getElementById("messageInput");

    const content =
      document.getElementById("chatContent");

    const welcome =
      document.getElementById("welcome");

    const sendButton =
      document.getElementById("sendButton");

    /* =========================
       STARTUP
       ========================= */

    renderRecentChats();

    input.addEventListener("input", () => {

      input.style.height = "auto";

      input.style.height =
        Math.min(input.scrollHeight, 180) + "px";

    });

    /* =========================
       NEW CHAT
       ========================= */

    function newChat() {

      state.messages = [];
      state.image = null;
      state.mode = "Chat";

      content.innerHTML = "";

      const welcomeClone =
        document.createElement("div");

      welcomeClone.className = "welcome";

      welcomeClone.innerHTML = `
        <div class="welcome-logo">∞</div>

        <h1>Hey 👋 I'm Infinity AI</h1>

        <p>
          Your intelligent AI workspace for studying,
          research, creativity and more.
        </p>

        <div class="quick-grid">

          <button class="quick-card"
            onclick="usePrompt('Explain this topic to me like I am in Year 10.')">
            <strong>🎓 Study</strong>
            <span>Learn difficult topics simply.</span>
          </button>

          <button class="quick-card"
            onclick="usePrompt('Help me research this topic and organize the important information.')">
            <strong>🔎 Research</strong>
            <span>Understand and organize information.</span>
          </button>

          <button class="quick-card"
            onclick="usePrompt('Help me create a creative idea for this project.')">
            <strong>✨ Create</strong>
            <span>Brainstorm and create.</span>
          </button>

          <button class="quick-card"
            onclick="usePrompt('Help me write clean and professional code.')">
            <strong>💻 Code</strong>
            <span>Build and debug code.</span>
          </button>

        </div>
      `;

      content.appendChild(welcomeClone);

      input.value = "";

      document.getElementById("modeName").textContent = "Chat";
      document.getElementById("composerMode").textContent = "Chat";

    }

    /* =========================
       MODE
       ========================= */

    function setMode(mode, button = null) {

      state.mode = mode;

      document.getElementById("modeName").textContent = mode;
      document.getElementById("composerMode").textContent = mode;

      document
        .querySelectorAll(".nav button")
        .forEach(btn => btn.classList.remove("active"));

      if (button) {
        button.classList.add("active");
      }

    }

    /* =========================
       PROMPTS
       ========================= */

    function usePrompt(text) {

      input.value = text;

      input.focus();

      input.style.height = "auto";
      input.style.height =
        Math.min(input.scrollHeight, 180) + "px";

    }

    /* =========================
       SEND
       ========================= */

    async function send() {

      const text =
        input.value.trim();

      if (!text || sendButton.disabled) {
        return;
      }

      input.value = "";
      input.style.height = "auto";

      if (welcome) {
        welcome.remove();
      }

      state.messages.push({
        role: "user",
        content: text
      });

      renderMessage(
        "user",
        text
      );

      saveCurrentChat();

      const typing = showTyping();

      sendButton.disabled = true;

      try {

        const response = await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              messages: state.messages,
              mode: state.mode
            })
          }
        );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data?.error ||
            "AI request failed."
          );

        }

        /*
          Infinity AI backend returns:

          {
            "reply": "AI response here"
          }

          We also support several common formats
          so the frontend is more robust.
        */

        const reply =
          data?.reply ||
          data?.message ||
          data?.content ||
          data?.text ||
          data?.choices?.[0]?.message?.content ||
          data?.choices?.[0]?.text;

        if (!reply) {

          console.error(
            "Unknown AI response:",
            data
          );

          throw new Error(
            "I received a response, but couldn't read its format."
          );

        }

        typing.remove();

        state.messages.push({
          role: "assistant",
          content: String(reply)
        });

        renderMessage(
          "assistant",
          String(reply)
        );

        saveCurrentChat();

      } catch (error) {

        console.error(
          "Infinity AI error:",
          error
        );

        typing.remove();

        renderMessage(
          "assistant",
          "⚠️ " +
          (
            error.message ||
            "I couldn't connect to the AI right now."
          )
        );

      } finally {

        sendButton.disabled = false;

        input.focus();

      }

    }

    /* =========================
       RENDER MESSAGE
       ========================= */

    function renderMessage(
      role,
      text
    ) {

      const message =
        document.createElement("div");

      message.className =
        "message " + role;

      const avatar =
        role === "user"
          ? "You"
          : "∞";

      const name =
        role === "user"
          ? "You"
          : "Infinity AI";

      message.innerHTML = `
        <div class="avatar">
          ${avatar}
        </div>

        <div class="message-body">

          <div class="message-name">
            ${name}
          </div>

          <div class="message-text">
            ${formatText(text)}
          </div>

          ${
            role === "assistant"
              ? `
                <div class="message-actions">
                  <button onclick="copyText(this)">
                    Copy
                  </button>

                  <button onclick="shareText(this)">
                    Share
                  </button>

                  <button onclick="regenerate()">
                    Regenerate
                  </button>
                </div>
              `
              : ""
          }

        </div>
      `;

      content.appendChild(message);

      scrollToBottom();

    }

    /* =========================
       FORMAT TEXT
       ========================= */

    function formatText(text) {

      let safe =
        escapeHTML(String(text));

      /*
        Basic Markdown support
      */

      safe =
        safe.replace(
          /\*\*(.*?)\*\*/g,
          "<strong>$1</strong>"
        );

      safe =
        safe.replace(
          /\*(.*?)\*/g,
          "<em>$1</em>"
        );

      safe =
        safe.replace(
          /`([^`]+)`/g,
          "<code>$1</code>"
        );

      safe =
        safe.replace(
          /\n/g,
          "<br>"
        );

      return safe;

    }

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }

    /* =========================
       TYPING
       ========================= */

    function showTyping() {

      const message =
        document.createElement("div");

      message.className =
        "message assistant";

      message.innerHTML = `
        <div class="avatar">∞</div>

        <div class="message-body">

          <div class="message-name">
            Infinity AI
          </div>

          <div class="typing">

            <span></span>
            <span></span>
            <span></span>

          </div>

        </div>
      `;

      content.appendChild(message);

      scrollToBottom();

      return message;

    }

    /* =========================
       SAVE CHAT
       ========================= */

    function saveCurrentChat() {

      if (!state.messages.length) {
        return;
      }

      const firstUser =
        state.messages.find(
          message =>
            message.role === "user"
        );

      const title =
        firstUser
          ? firstUser.content.slice(0, 45)
          : "New chat";

      const chat = {
        id: Date.now(),
        title,
        messages: state.messages,
        mode: state.mode
      };

      chatHistory.unshift(chat);

      /*
        Keep only the latest 30 chats.
      */

      chatHistory =
        chatHistory.slice(0, 30);

      localStorage.setItem(
        "infinity_ai_chats",
        JSON.stringify(chatHistory)
      );

      renderRecentChats();

    }

    /* =========================
       RECENT CHATS
       ========================= */

    function renderRecentChats() {

      const container =
        document.getElementById(
          "recentChats"
        );

      container.innerHTML = "";

      chatHistory
        .slice(0, 10)
        .forEach(chat => {

          const button =
            document.createElement("button");

          button.className =
            "recent-chat";

          button.textContent =
            chat.title;

          button.onclick =
            () => loadChat(chat);

          container.appendChild(
            button
          );

        });

    }

    function loadChat(chat) {

      state.messages =
        [...chat.messages];

      state.mode =
        chat.mode || "Chat";

      content.innerHTML = "";

      document.getElementById(
        "modeName"
      ).textContent =
        state.mode;

      document.getElementById(
        "composerMode"
      ).textContent =
        state.mode;

      state.messages.forEach(
        message => {

          renderMessage(
            message.role,
            message.content
          );

        }
      );

    }

    /* =========================
       COPY
       ========================= */

    async function copyText(button) {

      const message =
        button
          .closest(".message")
          .querySelector(".message-text")
          .innerText;

      try {

        await navigator.clipboard.writeText(
          message
        );

        button.textContent =
          "Copied ✓";

        setTimeout(() => {
          button.textContent =
            "Copy";
        }, 1500);

      } catch {

        alert(
          "Copy is not available."
        );

      }

    }

    /* =========================
       SHARE
       ========================= */

    async function shareChat() {

      const text =
        state.messages
          .map(
            m =>
              `${m.role}: ${m.content}`
          )
          .join("\n\n");

      if (
        navigator.share
      ) {

        try {

          await navigator.share({
            title: "Infinity AI",
            text
          });

        } catch {}

      } else {

        await navigator.clipboard.writeText(
          text
        );

        alert(
          "Chat copied to clipboard."
        );

      }

    }

    async function shareText(button) {

      const message =
        button
          .closest(".message")
          .querySelector(".message-text")
          .innerText;

      if (
        navigator.share
      ) {

        try {

          await navigator.share({
            title: "Infinity AI",
            text: message
          });

        } catch {}

      } else {

        await navigator.clipboard.writeText(
          message
        );

        button.textContent =
          "Copied ✓";

        setTimeout(() => {
          button.textContent =
            "Share";
        }, 1500);

      }

    }

    /* =========================
       REGENERATE
       ========================= */

    async function regenerate() {

      if (
        state.messages.length === 0
      ) {
        return;
      }

      const last =
        state.messages[
          state.messages.length - 1
        ];

      if (
        last.role === "assistant"
      ) {

        state.messages.pop();

      }

      /*
        Remove the last assistant
        message from the visible UI.
      */

      const messages =
        document.querySelectorAll(
          ".message.assistant"
        );

      const lastVisible =
        messages[messages.length - 1];

      if (lastVisible) {
        lastVisible.remove();
      }

      const typing =
        showTyping();

      try {

        const response =
          await fetch(
            "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                messages:
                  state.messages,
                mode:
                  state.mode
              })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data?.error ||
            "Regeneration failed."
          );
        }

        const reply =
          data?.reply ||
          data?.message ||
          data?.content ||
          data?.choices?.[0]?.message?.content;

        if (!reply) {
          throw new Error(
            "The AI response had an unknown format."
          );
        }

        typing.remove();

        state.messages.push({
          role: "assistant",
          content: String(reply)
        });

        renderMessage(
          "assistant",
          String(reply)
        );

        saveCurrentChat();

      } catch (error) {

        typing.remove();

        renderMessage(
          "assistant",
          "⚠️ " +
          (
            error.message ||
            "Could not regenerate."
          )
        );

      }

    }

    /* =========================
       IMAGE PREVIEW
       ========================= */

    function previewImage(event) {

      const file =
        event.target.files?.[0];

      if (!file) {
        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        function(e) {

          state.image =
            e.target.result;

          const preview =
            document.getElementById(
              "imagePreview"
            );

          preview.style.display =
            "block";

          preview.innerHTML = `
            <img
              src="${state.image}"
              alt="Selected image"
            />
          `;

        };

      reader.readAsDataURL(file);

    }

    /* =========================
       VOICE
       ========================= */

    function startVoice() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {

        alert(
          "Voice input is not supported in this browser."
        );

        return;

      }

      const recognition =
        new SpeechRecognition();

      recognition.lang =
        "en-US";

      recognition.interimResults =
        false;

      recognition.onresult =
        event => {

          input.value =
            event.results[0][0].transcript;

          input.dispatchEvent(
            new Event("input")
          );

        };

      recognition.onerror =
        () => {

          alert(
            "Voice input could not start."
          );

        };

      recognition.start();

    }

    /* =========================
       KEYBOARD
       ========================= */

    function handleKey(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        send();

      }

    }

    /* =========================
       THEME
       ========================= */

    function toggleTheme() {

      document.body.classList.toggle(
        "light"
      );

      localStorage.setItem(
        "infinity_ai_theme",
        document.body.classList.contains(
          "light"
        )
          ? "light"
          : "dark"
      );

    }

    if (
      localStorage.getItem(
        "infinity_ai_theme"
      ) === "light"
    ) {

      document.body.classList.add(
        "light"
      );

    }

    /* =========================
       SETTINGS
       ========================= */

    function showSettings() {

      alert(
        "Infinity AI Settings\n\n" +
        "More settings and personalization " +
        "will be added soon."
      );

    }

    /* =========================
       MOBILE SIDEBAR
       ========================= */

    function toggleSidebar() {

      document
        .getElementById("sidebar")
        .classList.toggle("open");

    }

    /* =========================
       SCROLL
       ========================= */

    function scrollToBottom() {

      const area =
        document.getElementById(
          "chatArea"
        );

      setTimeout(() => {

        area.scrollTo({
          top: area.scrollHeight,
          behavior: "smooth"
        });

      }, 50);

    }

  </script>

</body>
</html>
