<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    button,
    input {
      font: inherit;
    }

    /* LOGIN */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 22px;
      padding: 35px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      font-size: 55px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .login-title {
      text-align: center;
      font-size: 28px;
      margin: 0;
    }

    .login-subtitle {
      text-align: center;
      color: #777;
      margin: 8px 0 25px;
    }

    .login-card input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
    }

    .login-button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .switch-login {
      text-align: center;
      margin-top: 18px;
      color: #666;
    }

    .switch-login button {
      border: 0;
      background: none;
      font-weight: bold;
      cursor: pointer;
    }

    .login-error {
      color: #d00;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
    }

    /* APP */

    #app {
      display: none;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 270px;
      height: 100vh;
      background: #f7f7f7;
      border-right: 1px solid #e5e5e5;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: bold;
      padding: 10px;
    }

    .brand-icon {
      font-size: 30px;
    }

    .new-chat {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      text-align: left;
      font-weight: bold;
      margin: 10px 0;
    }

    .history-title {
      font-size: 12px;
      color: #777;
      padding: 10px;
      text-transform: uppercase;
    }

    #chatHistory {
      flex: 1;
      overflow-y: auto;
    }

    .history-item {
      padding: 11px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:hover {
      background: #e9e9e9;
    }

    .profile {
      border-top: 1px solid #ddd;
      padding-top: 12px;
    }

    .profile-name {
      font-weight: bold;
      padding: 5px;
    }

    .logout {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 9px;
      text-align: left;
      cursor: pointer;
      color: #777;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .topbar {
      height: 60px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      padding: 0 22px;
      font-weight: bold;
    }

    .mode {
      margin-left: auto;
      font-size: 13px;
      color: #777;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
    }

    .welcome {
      max-width: 800px;
      margin: 100px auto;
      text-align: center;
    }

    .welcome h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #777;
      font-size: 17px;
    }

    .message {
      max-width: 850px;
      margin: 0 auto 20px;
      padding: 15px 18px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #f1f1f1;
    }

    .assistant {
      background: white;
      border: 1px solid #eee;
    }

    .input-area {
      padding: 15px 25px 20px;
      border-top: 1px solid #eee;
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      display: flex;
      gap: 10px;
      border: 1px solid #ddd;
      border-radius: 18px;
      padding: 8px;
      background: white;
    }

    .input-box input {
      flex: 1;
      border: 0;
      outline: 0;
      padding: 10px;
    }

    .send {
      border: 0;
      border-radius: 12px;
      background: #111;
      color: white;
      padding: 10px 16px;
      cursor: pointer;
    }

    .disclaimer {
      text-align: center;
      font-size: 11px;
      color: #999;
      margin-top: 8px;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 210px;
      }

      .welcome h1 {
        font-size: 32px;
      }

      #messages {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div id="loginScreen">

    <div class="login-card">

      <div class="logo">∞</div>

      <h1 class="login-title">Infinity AI</h1>

      <p class="login-subtitle">
        Your all-in-one AI assistant
      </p>

      <input
        id="nameInput"
        type="text"
        placeholder="Your name"
      >

      <input
        id="emailInput"
        type="email"
        placeholder="Email"
      >

      <input
        id="passwordInput"
        type="password"
        placeholder="Password"
      >

      <button class="login-button" onclick="login()">
        Continue
      </button>

      <div class="switch-login">
        <button onclick="demoAccount()">
          Use demo account
        </button>
      </div>

      <div id="loginError" class="login-error"></div>

    </div>

  </div>


  <!-- APP -->

  <div id="app">

    <aside class="sidebar">

      <div class="brand">
        <span class="brand-icon">∞</span>
        Infinity AI
      </div>

      <button class="new-chat" onclick="newChat()">
        ＋ New chat
      </button>

      <div class="history-title">
        Chat history
      </div>

      <div id="chatHistory"></div>

      <div class="profile">
        <div class="profile-name" id="profileName"></div>

        <button class="logout" onclick="logout()">
          🚪 Log out
        </button>
      </div>

    </aside>


    <main class="main">

      <div class="topbar">
        Infinity AI
        <span class="mode" id="modeText">
          General
        </span>
      </div>

      <div id="messages">

        <div class="welcome">

          <h1>What can I help with?</h1>

          <p>
            Ask Infinity AI anything you need help with.
          </p>

        </div>

      </div>


      <div class="input-area">

        <div class="input-box">

          <input
            id="messageInput"
            type="text"
            placeholder="Message Infinity AI..."
            onkeydown="handleEnter(event)"
          >

          <button class="send" onclick="sendMessage()">
            Send
          </button>

        </div>

        <div class="disclaimer">
          Infinity AI was created by Luis Gabriel Marino.
        </div>

      </div>

    </main>

  </div>


<script>

let currentUser = null;
let currentChatId = null;
let chats = [];


// LOGIN

function login() {

  const name = document.getElementById("nameInput").value.trim();
  const email = document.getElementById("emailInput").value.trim();
  const password = document.getElementById("passwordInput").value;

  if (!name || !email || !password) {

    document.getElementById("loginError").textContent =
      "Please fill in all fields.";

    return;
  }

  currentUser = {
    name,
    email
  };

  localStorage.setItem(
    "infinityUser",
    JSON.stringify(currentUser)
  );

  startApp();
}


function demoAccount() {

  currentUser = {
    name: "Infinity User",
    email: "demo@infinity.ai"
  };

  localStorage.setItem(
    "infinityUser",
    JSON.stringify(currentUser)
  );

  startApp();
}


function logout() {

  localStorage.removeItem("infinityUser");

  location.reload();
}


// APP

function startApp() {

  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "flex";

  document.getElementById("profileName").textContent =
    currentUser.name;

  loadChats();

  if (chats.length === 0) {
    newChat();
  } else {
    openChat(chats[0].id);
  }
}


// CHAT STORAGE

function storageKey() {

  return "infinityChats_" + currentUser.email;
}


function loadChats() {

  const saved =
    localStorage.getItem(storageKey());

  chats = saved ? JSON.parse(saved) : [];

  renderHistory();
}


function saveChats() {

  localStorage.setItem(
    storageKey(),
    JSON.stringify(chats)
  );

  renderHistory();
}


function newChat() {

  const chat = {

    id: Date.now(),

    title: "New chat",

    messages: []

  };

  chats.unshift(chat);

  currentChatId = chat.id;

  saveChats();

  renderMessages();
}


function openChat(id) {

  const chat =
    chats.find(c => c.id === id);

  if (!chat) return;

  currentChatId = id;

  renderMessages();
}


function renderHistory() {

  const container =
    document.getElementById("chatHistory");

  container.innerHTML = "";

  chats.forEach(chat => {

    const item =
      document.createElement("div");

    item.className = "history-item";

    item.textContent = chat.title;

    item.onclick = () =>
      openChat(chat.id);

    container.appendChild(item);

  });
}


function renderMessages() {

  const container =
    document.getElementById("messages");

  container.innerHTML = "";

  const chat =
    chats.find(c => c.id === currentChatId);

  if (!chat || chat.messages.length === 0) {

    container.innerHTML = `
      <div class="welcome">
        <h1>What can I help with?</h1>
        <p>Ask Infinity AI anything you need help with.</p>
      </div>
    `;

    return;
  }

  chat.messages.forEach(message => {

    const div =
      document.createElement("div");

    div.className =
      "message " + message.role;

    div.textContent =
      message.content;

    container.appendChild(div);

  });

  container.scrollTop =
    container.scrollHeight;
}


// SEND MESSAGE

async function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const message =
    input.value.trim();

  if (!message) return;

  const chat =
    chats.find(c => c.id === currentChatId);

  if (!chat) return;

  chat.messages.push({

    role: "user",

    content: message

  });

  if (chat.title === "New chat") {

    chat.title =
      message.substring(0, 35);

  }

  input.value = "";

  saveChats();

  renderMessages();


  const thinking = {

    role: "assistant",

    content: "Thinking..."

  };

  chat.messages.push(thinking);

  renderMessages();


  try {

    const response =
      await fetch("/api/chat", {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body: JSON.stringify({

          message,

          mode: "General",

          history:
            chat.messages
              .slice(0, -1)

        })

      });


    const data =
      await response.json();


    chat.messages.pop();


    if (!response.ok) {

      chat.messages.push({

        role: "assistant",

        content:
          data.error ||
          "Infinity AI couldn't respond."

      });

    } else {

      chat.messages.push({

        role: "assistant",

        content:
          data.answer

      });

    }


    saveChats();

    renderMessages();

  } catch (error) {

    chat.messages.pop();

    chat.messages.push({

      role: "assistant",

      content:
        "Sorry, Infinity AI couldn't respond right now."

    });

    saveChats();

    renderMessages();

  }

}


function handleEnter(event) {

  if (event.key === "Enter") {

    sendMessage();

  }

}


// AUTO LOGIN

const savedUser =
  localStorage.getItem("infinityUser");

if (savedUser) {

  currentUser =
    JSON.parse(savedUser);

  startApp();

}

</script>

</body>
</html>
