<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinity AI</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b0b0f;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

.sidebar{
width:240px;
background:#111116;
padding:20px;
border-right:1px solid #25252d;
}

.logo{
font-size:24px;
font-weight:bold;
margin-bottom:25px;
}

.mode{
padding:12px;
margin:6px 0;
border-radius:10px;
cursor:pointer;
background:#181820;
}

.mode:hover{
background:#24242d;
}

.creator{
position:absolute;
bottom:15px;
font-size:12px;
color:#888;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

.header{
padding:18px 25px;
border-bottom:1px solid #25252d;
font-size:20px;
font-weight:bold;
}

.chat{
flex:1;
overflow-y:auto;
padding:25px;
}

.message{
max-width:750px;
padding:14px 17px;
margin:12px auto;
border-radius:15px;
line-height:1.5;
white-space:pre-wrap;
}

.user{
background:#24243a;
}

.ai{
background:#17171e;
}

.message img{
max-width:300px;
border-radius:12px;
margin-top:10px;
display:block;
}

.composer{
padding:18px;
border-top:1px solid #25252d;
display:flex;
gap:10px;
}

textarea{
flex:1;
resize:none;
height:55px;
background:#181820;
border:1px solid #30303a;
border-radius:14px;
color:white;
padding:15px;
font-size:15px;
outline:none;
}

button{
border:0;
border-radius:12px;
padding:0 18px;
font-size:18px;
cursor:pointer;
background:#292936;
color:white;
}

.send{
background:#ffffff;
color:#000;
}

.clear{
font-size:13px;
padding:8px 12px;
margin-left:10px;
}

@media(max-width:700px){
.sidebar{display:none}
}
</style>
</head>

<body>

<div class="sidebar">

<div class="logo">∞ Infinity AI</div>

<div class="mode">🧠 Study</div>
<div class="mode">🎨 Art</div>
<div class="mode">🔎 Research</div>
<div class="mode">✍️ Write</div>
<div class="mode">💻 Code</div>
<div class="mode">📷 Images</div>

<button class="clear" onclick="clearChat()">🗑️ Clear chat</button>

<div class="creator">
Created by Luis Gabriel Marino
</div>

</div>

<div class="main">

<div class="header">
Infinity AI
</div>

<div id="chat" class="chat"></div>

<div class="composer">

<input
type="file"
id="imageInput"
accept="image/*"
style="display:none"
>

<button
type="button"
onclick="document.getElementById('imageInput').click()">
📎
</button>

<textarea
id="input"
placeholder="Message Infinity AI..."
></textarea>

<button
class="send"
id="send"
onclick="send()">
➤
</button>

</div>

</div>

<script>

let history =
JSON.parse(localStorage.getItem("infinity_history") || "[]");

function saveHistory(){

localStorage.setItem(
"infinity_history",
JSON.stringify(history)
);

}

function addMessage(role,text,image=null){

const chat=document.getElementById("chat");

const div=document.createElement("div");

div.className="message "+role;

div.textContent=text;

if(image){

const img=document.createElement("img");

img.src=image;

div.appendChild(img);

}

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

return div;

}

function loadChat(){

document.getElementById("chat").innerHTML="";

for(const msg of history){

if(msg.role==="user"){

addMessage(
"user",
msg.text || "📷 Image",
msg.image
);

}else if(msg.role==="assistant"){

addMessage(
"ai",
msg.content
);

}

}

if(history.length===0){

addMessage(
"ai",
"Hey 👋 I'm Infinity AI. How can I help?"
);

}

}

async function send(){

const input=document.getElementById("input");

const btn=document.getElementById("send");

const imageInput=document.getElementById("imageInput");

const text=input.value.trim();

const file=imageInput.files[0];

if((!text&&!file)||btn.disabled)return;

let imageData=null;

if(file){

imageData=await new Promise(
(resolve,reject)=>{

const reader=new FileReader();

reader.onload=()=>{
resolve(reader.result);
};

reader.onerror=reject;

reader.readAsDataURL(file);

});

}

addMessage(
"user",
text || "📷 Image",
imageData
);

const userHistory={
role:"user",
text:text,
image:imageData
};

history.push(userHistory);

saveHistory();

input.value="";

imageInput.value="";

btn.disabled=true;

btn.textContent="…";

const thinking=addMessage(
"ai",
"Thinking…"
);

try{

const message={
role:"user",
content:[]
};

if(text){

message.content.push({
type:"text",
text:text
});

}

if(imageData){

message.content.push({
type:"image_url",
image_url:{
url:imageData
}
});

}

const apiMessages=[];

for(const item of history){

if(item.role==="user"){

const content=[];

if(item.text){

content.push({
type:"text",
text:item.text
});

}

if(item.image){

content.push({
type:"image_url",
image_url:{
url:item.image
}
});

}

apiMessages.push({
role:"user",
content:content
});

}else{

apiMessages.push({
role:"assistant",
content:item.content
});

}

}

const res=await fetch(
"/api/chat",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
messages:apiMessages
})
}
);

const data=await res.json();

thinking.remove();

const answer=
data.reply ||
data.error ||
"Infinity AI couldn't answer.";

addMessage(
"ai",
answer
);

history.push({
role:"assistant",
content:answer
});

saveHistory();

}catch(error){

thinking.remove();

addMessage(
"ai",
"Infinity AI couldn't reach its AI server."
);

}finally{

btn.disabled=false;

btn.textContent="➤";

input.focus();

}

}

function clearChat(){

if(confirm("Delete this conversation?")){

history=[];

localStorage.removeItem(
"infinity_history"
);

loadChat();

}

}

document.getElementById("input")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"&&!e.shiftKey){

e.preventDefault();

send();

}

});

loadChat();

</script>

</body>
</html>
