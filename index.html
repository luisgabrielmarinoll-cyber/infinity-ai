<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #ffffff;
      --sidebar: #f7f7f8;
      --text: #171717;
      --muted: #737373;
      --border: #e5e5e5;
      --input: #f7f7f8;
      --hover: #ececec;
      --accent: #111111;
      --user: #eeeeee;
    }

    body.dark {
      --bg: #171717;
      --sidebar: #202020;
      --text: #f5f5f5;
      --muted: #a3a3a3;
      --border: #333333;
      --input: #252525;
      --hover: #303030;
      --accent: #ffffff;
      --user: #303030;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    button {
      font-family: inherit;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 280px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .logo {
      width: 34px;
      height: 34px;
      border: 3px solid var(--text);
      border-radius: 50%;
      position: relative;
    }

    .logo::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      border: 3px solid var(--text);
      border-radius: 50%;
      left: 8px;
      top: 6px;
      background: var(--sidebar);
    }

    .new-chat {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 13px 15px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      text-align: left;
      margin-bottom: 18px;
    }

    .new-chat:hover {
      background: var(--hover);
    }

    .search {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 10px;
      padding: 11px;
      margin-bottom: 20px;
      outline: none;
    }

    .section-title {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .08em;
      margin: 5px 8px 10px;
    }

    .history {
      flex: 1;
      overflow-y: auto;
    }

    .history-item {
      padding: 10px 11px;
      border-radius: 9px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14px;
      margin-bottom: 3px;
    }

    .history-item:hover {
      background: var(--hover);
    }

    .account {
      border-top: 1px solid var(--border);
      padding-top: 15px;
    }

    .account-name {
      font-weight: 700;
      margin-bottom: 10px;
    }

    .side-button {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      padding: 10px;
      text-align: left;
      border-radius: 9px;
      cursor: pointer;
    }

    .side-button:hover {
      background: var(--hover);
    }

    /* MAIN */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 64px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .model-name {
      font-weight: 700;
      font-size: 18px;
    }

    .mode-select {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 9px;
      cursor: pointer;
    }

    .mobile-menu {
      display: none;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 22px;
    }

    /* WELCOME */

    .welcome {
      text-align: center;
      margin: auto;
      max-width: 720px;
      padding: 30px;
    }

    .welcome h1 {
      font-size: 42px;
      margin: 0 0 12px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 17px;
      margin-bottom: 28px;
    }

    .capabilities {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .capability {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 17px;
      cursor: pointer;
      background: var(--bg);
      color: var(--text);
      text-align: left;
    }

    .capability:hover {
      background: var(--hover);
    }

    .capability strong {
      display: block;
      margin-bottom: 5px;
    }

    .capability span {
      color: var(--muted);
      font-size: 13px;
    }

    /* CHAT */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 35px 20px 160px;
      display: none;
    }

    .message {
      max-width: 850px;
      margin: 0 auto 22px;
    }

    .message-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 7px;
      font-weight: 700;
    }

    .message-content {
      line-height: 1.6;
      white-space: pre-wrap;
      font-size: 16px;
    }

    .user-message .message-content {
      background: var(--user);
      padding: 13px 17px;
      border-radius: 16px;
      display: inline-block;
      max-width: 85%;
    }

    /* INPUT */

    .input-area {
      position: fixed;
      bottom: 0;
      left: 280px;
      right: 0;
      background: linear-gradient(
        transparent,
        var(--bg) 25%
      );
      padding: 35px 20px 18px;
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      border: 1px solid var(--border);
      background: var(--input);
      border-radius: 18px;
      padding: 10px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,.05);
    }

    textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      padding: 10px;
      min-height: 42px;
      max-height: 150px;
      font-family: inherit;
    }

    .icon-button,
    .send-button {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .icon-button {
      background: transparent;
      color: var(--muted);
    }

    .icon-button:hover {
      background: var(--hover);
      color: var(--text);
    }

    .send-button {
      background: var(--accent);
      color: var(--bg);
      font-weight: bold;
    }

    .send-button:hover {
      opacity: .8;
    }

    .disclaimer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 8px;
    }

    .typing {
      color: var(--muted);
      font-style: italic;
    }

    /* MOBILE */

    @media (max-width: 800px) {
      .sidebar {
        position: fixed;
        left: -290px;
        top: 0;
        bottom: 0;
        z-index: 20;
        transition: left .2s;
      }

      .sidebar.open {
        left: 0;
      }

      .mobile-menu {
        display: block;
      }

      .topbar {
        padding: 0 15px;
      }

      .input-area {
        left: 0;
        padding: 25px 12px 12px;
      }

      .welcome {
        padding: 20px;
      }

      .welcome h1 {
        font-size: 32px;
      }

      .capabilities {
        grid-template-columns: 1fr 1fr;
      }

      .chat {
        padding-left: 12px;
        padding-right: 12px;
      }
    }

    @media (max-width: 480px) {
      .capabilities {
        grid-template-columns: 1fr;
      }

      .model-name {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="logo"></div>
      Infinity AI
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New chat
    </button>

    <input
      class="search"
      id="search"
      placeholder="Search chats..."
      oninput="searchChats()"
    >

    <div class="section-title">CHAT HISTORY</div>

    <div class="history" id="history"></div>

    <div class="account">
      <div class="account-name">Gabriel</div>

      <button class="side-button" onclick="toggleDarkMode()">
        ◐ Appearance
      </button>

      <button class="side-button" onclick="alert('Settings coming soon.')">
        ⚙ Settings
      </button>

      <button class="side-button" onclick="alert('Login system coming next.')">
        👤 Account
      </button>
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">

      <button class="mobile-menu" onclick="toggleSidebar()">
        ☰
      </button>

      <div class="model-name">
        Infinity AI
      </div>

      <select class="mode-select" id="mode">
        <option>General</option>
        <option>Study</option>
        <option>Research</option>
        <option>Writing</option>
        <option>Code</option>
        <option>Creative</option>
      </select>

    </header>

    <!-- WELCOME -->
    <section class="welcome" id="welcome">

      <h1>What can I help you with?</h1>

      <p>
        Your all-in-one AI assistant for learning, research,
        creativity, writing and coding.
      </p>

      <div class="capabilities">

        <button class="capability" onclick="usePrompt('Help me study this topic')">
          <strong>🧠 Study</strong>
          <span>Learn and understand difficult topics.</span>
        </button>

        <button class="capability" onclick="usePrompt('Research this topic for me')">
          <strong>🔎 Research</strong>
          <span>Explore information and explain it clearly.</span>
        </button>

        <button class="capability" onclick="usePrompt('Help me write something')">
          <strong>✍️ Writing</strong>
          <span>Write, improve and organize ideas.</span>
        </button>

        <button class="capability" onclick="usePrompt('Help me with this code')">
          <strong>💻 Code</strong>
          <span>Build and understand software.</span>
        </button>

        <button class="capability" onclick="usePrompt('Give me creative ideas')">
          <strong>🎨 Creative</strong>
          <span>Ideas for art, projects and creativity.</span>
        </button>

        <button class="capability" onclick="usePrompt('Explain this to me simply')">
          <strong>🌎 Explain</strong>
          <span>Simple explanations for complex ideas.</span>
        </button>

      </div>

    </section>

    <!-- CHAT -->
    <section class="chat" id="chat"></section>

  </main>

</div>

<!-- INPUT -->
<div class="input-area">

  <div class="input-box">

    <button class="icon-button" onclick="document.getElementById('file').click()">
      ＋
    </button>

    <input
      type="file"
      id="file"
      hidden
      onchange="fileSelected()"
    >

    <textarea
      id="message"
      placeholder="Message Infinity AI..."
      rows="1"
      onkeydown="handleKey(event)"
    ></textarea>

    <button class="icon-button" onclick="startVoice()">
      🎙
    </button>

    <button class="send-button" onclick="sendMessage()">
      ↑
    </button>

  </div>

  <div class="disclaimer">
    Infinity AI was created by Luis Gabriel Marino.
  </div>

</div>

<script>

  let messages = [];
  let chats = JSON.parse(localStorage.getItem("infinityChats") || "[]");

  const messageInput = document.getElementById("message");
  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");
  const history = document.getElementById("history");

  function saveChats() {
    localStorage.setItem("infinityChats", JSON.stringify(chats));
  }

  function renderHistory() {

    history.innerHTML = "";

    chats.forEach((item, index) => {

      const div = document.createElement("div");

      div.className = "history-item";
      div.textContent = item.title || "New chat";

      div.onclick = () => loadChat(index);

      history.appendChild(div);

    });
  }

  function newChat() {

    messages = [];

    chat.innerHTML = "";

    chat.style.display = "none";
    welcome.style.display = "block";

    messageInput.value = "";

    document.getElementById("sidebar").classList.remove("open");
  }

  function loadChat(index) {

    messages = chats[index].messages || [];

    welcome.style.display = "none";
    chat.style.display = "block";

    chat.innerHTML = "";

    messages.forEach(m => {

      addMessageToScreen(
        m.role === "user" ? "You" : "Infinity AI",
        m.content,
        m.role === "user"
      );

    });

  }

  function addMessageToScreen(label, content, user = false) {

    const div = document.createElement("div");

    div.className = "message " + (user ? "user-message" : "");

    div.innerHTML = `
      <div class="message-label">${label}</div>
      <div class="message-content"></div>
    `;

    div.querySelector(".message-content").textContent = content;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
  }

  async function sendMessage() {

    const text = messageInput.value.trim();

    if (!text) return;

    welcome.style.display = "none";
    chat.style.display = "block";

    addMessageToScreen("You", text, true);

    messages.push({
      role: "user",
      content: text
    });

    messageInput.value = "";

    const typing = document.createElement("div");

    typing.className = "message";

    typing.innerHTML = `
      <div class="message-label">Infinity AI</div>
      <div class="message-content typing">
        Thinking...
      </div>
    `;

    chat.appendChild(typing);

    chat.scrollTop = chat.scrollHeight;

    try {

      const response = await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          message: text,

          mode: document.getElementById("mode").value,

          history: messages.slice(-12)

        })

      });

      const data = await response.json();

      typing.remove();

      if (!response.ok) {
        throw new Error(data.error || "Something went wrong.");
      }

      addMessageToScreen(
        "Infinity AI",
        data.answer,
        false
      );

      messages.push({
        role: "assistant",
        content: data.answer
      });

      saveCurrentChat();

    } catch (error) {

      typing.remove();

      addMessageToScreen(
        "Infinity AI",
        "Sorry, something went wrong: " + error.message,
        false
      );

    }

  }

  function saveCurrentChat() {

    if (messages.length === 0) return;

    const firstUser = messages.find(
      m => m.role === "user"
    );

    const title = firstUser
      ? firstUser.content.substring(0, 35)
      : "New chat";

    chats.unshift({
      title: title,
      messages: messages
    });

    chats = chats.slice(0, 50);

    saveChats();

    renderHistory();

  }

  function handleKey(event) {

    if (event.key === "Enter" && !event.shiftKey) {

      event.preventDefault();

      sendMessage();

    }

  }

  function usePrompt(text) {

    messageInput.value = text;

    messageInput.focus();

  }

  function toggleDarkMode() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
      "infinityDark",
      document.body.classList.contains("dark")
    );

  }

  function toggleSidebar() {

    document
      .getElementById("sidebar")
      .classList.toggle("open");

  }

  function searchChats() {

    const query =
      document
        .getElementById("search")
        .value
        .toLowerCase();

    document.querySelectorAll(".history-item")
      .forEach(item => {

        item.style.display =
          item.textContent
            .toLowerCase()
            .includes(query)
              ? "block"
              : "none";

      });

  }

  function fileSelected() {

    const file =
      document.getElementById("file").files[0];

    if (!file) return;

    messageInput.value =
      "I uploaded a file called: " + file.name;

    messageInput.focus();

  }

  function startVoice() {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

      alert("Voice input is not supported in this browser.");

      return;

    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";

    recognition.start();

    recognition.onresult = function(event) {

      messageInput.value =
        event.results[0][0].transcript;

    };

  }

  if (
    localStorage.getItem("infinityDark") === "true"
  ) {
    document.body.classList.add("dark");
  }

  renderHistory();

</script>

</body>
</html>
