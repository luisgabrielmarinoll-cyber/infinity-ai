<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinity AI</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b0b0f;
color:#fff;
height:100vh;
display:flex;
overflow:hidden;
}

/* SIDEBAR */
.sidebar{
width:270px;
background:#111116;
border-right:1px solid #292932;
display:flex;
flex-direction:column;
padding:14px;
}

.logo{
font-size:22px;
font-weight:bold;
padding:10px;
margin-bottom:12px;
}

.new-chat{
width:100%;
padding:12px;
border-radius:10px;
background:#24242d;
color:white;
border:1px solid #35353f;
cursor:pointer;
font-size:14px;
margin-bottom:15px;
}

.new-chat:hover{
background:#30303a;
}

.chat-list{
flex:1;
overflow-y:auto;
}

.chat-item{
padding:11px 12px;
border-radius:9px;
margin-bottom:4px;
cursor:pointer;
font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.chat-item:hover{
background:#22222a;
}

.chat-item.active{
background:#292933;
}

.bottom{
font-size:12px;
color:#888;
padding:12px 8px;
border-top:1px solid #292932;
}

/* MAIN */
.main{
flex:1;
display:flex;
flex-direction:column;
min-width:0;
}

.header{
height:60px;
border-bottom:1px solid #292932;
display:flex;
align-items:center;
padding:0 22px;
font-size:18px;
font-weight:bold;
}

.chat{
flex:1;
overflow-y:auto;
padding:25px 20px 120px;
}

.message{
max-width:780px;
margin:14px auto;
padding:14px 17px;
border-radius:15px;
line-height:1.5;
white-space:pre-wrap;
}

.user{
background:#29293a;
}

.ai{
background:#17171e;
}

.message img{
max-width:330px;
max-height:330px;
border-radius:12px;
display:block;
margin-top:10px;
}

/* COMPOSER */
.composer-wrap{
position:absolute;
bottom:0;
left:270px;
right:0;
padding:15px 20px 20px;
background:linear-gradient(transparent,#0b0b0f 25%);
}

.composer{
max-width:800px;
margin:auto;
display:flex;
gap:8px;
background:#181820;
border:1px solid #34343e;
border-radius:16px;
padding:8px;
}

textarea{
flex:1;
height:44px;
resize:none;
border:0;
outline:0;
background:transparent;
color:white;
padding:12px;
font-size:15px;
}

button{
border:0;
cursor:pointer;
color:white;
background:#292932;
border-radius:11px;
padding:0 14px;
font-size:17px;
}

.send{
background:white;
color:black;
}

.disclaimer{
text-align:center;
font-size:11px;
color:#777;
margin-top:7px;
}

@media(max-width:700px){

.sidebar{
width:210px;
}

.composer-wrap{
left:210px;
}

}

@media(max-width:550px){

.sidebar{
display:none;
}

.composer-wrap{
left:0;
}

}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo">∞ Infinity AI</div>

<button class="new-chat" onclick="newChat()">
＋ New chat
</button>

<div id="chatList" class="chat-list"></div>

<div class="bottom">
Created by Luis Gabriel Marino
</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="header">
Infinity AI
</div>

<div id="chat" class="chat"></div>

<div class="composer-wrap">

<div class="composer">

<input
type="file"
id="imageInput"
accept="image/*"
style="display:none"
>

<button
onclick="document.getElementById('imageInput').click()">
📎
</button>

<textarea
id="input"
placeholder="Message Infinity AI..."
></textarea>

<button
class="send"
id="send"
onclick="send()">
➤
</button>

</div>

<div class="disclaimer">
Infinity AI can make mistakes. Check important information.
</div>

</div>

</div>

<script>

let conversations =
JSON.parse(localStorage.getItem("infinity_conversations") || "[]");

let currentChat =
localStorage.getItem("infinity_current_chat");

if(!currentChat || !conversations.find(c=>c.id===currentChat)){
currentChat=null;
}

function save(){
localStorage.setItem(
"infinity_conversations",
JSON.stringify(conversations)
);

if(currentChat){
localStorage.setItem(
"infinity_current_chat",
currentChat
);
}
}

function createConversation(){

const chat={
id:Date.now().toString(),
title:"New chat",
messages:[]
};

conversations.unshift(chat);

currentChat=chat.id;

save();

renderSidebar();

renderChat();

}

function getCurrent(){

return conversations.find(
c=>c.id===currentChat
);

}

function newChat(){

createConversation();

}

function renderSidebar(){

const list=document.getElementById("chatList");

list.innerHTML="";

for(const c of conversations){

const item=document.createElement("div");

item.className=
"chat-item "+
(c.id===currentChat?"active":"");

item.textContent=
c.title || "New chat";

item.onclick=()=>{

currentChat=c.id;

save();

renderSidebar();

renderChat();

};

list.appendChild(item);

}

}

function addMessage(role,text,image){

const chat=document.getElementById("chat");

const div=document.createElement("div");

div.className="message "+role;

div.textContent=text;

if(image){

const img=document.createElement("img");

img.src=image;

div.appendChild(img);

}

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

return div;

}

function renderChat(){

const area=document.getElementById("chat");

area.innerHTML="";

const current=getCurrent();

if(!current){

addMessage(
"ai",
"Hey 👋 I'm Infinity AI. Start a new chat!"
);

return;

}

if(current.messages.length===0){

addMessage(
"ai",
"Hey 👋 I'm Infinity AI. How can I help?"
);

return;

}

for(const m of current.messages){

addMessage(
m.role,
m.text || m.content || "",
m.image
);

}

}

async function send(){

const input=document.getElementById("input");

const btn=document.getElementById("send");

const imageInput=document.getElementById("imageInput");

const text=input.value.trim();

const file=imageInput.files[0];

if((!text&&!file)||btn.disabled)return;

if(!currentChat){

createConversation();

}

const current=getCurrent();

let imageData=null;

if(file){

imageData=await new Promise(
(resolve,reject)=>{

const reader=new FileReader();

reader.onload=()=>{
resolve(reader.result);
};

reader.onerror=reject;

reader.readAsDataURL(file);

});

}

current.messages.push({
role:"user",
text:text,
image:imageData
});

if(current.title==="New chat"){

current.title=
text ||
"📷 Image chat";

}

save();

renderSidebar();

renderChat();

input.value="";

imageInput.value="";

btn.disabled=true;

btn.textContent="…";

const thinking=addMessage(
"ai",
"Thinking…"
);

try{

const apiMessages=[];

for(const m of current.messages){

if(m.role==="user"){

const content=[];

if(m.text){

content.push({
type:"text",
text:m.text
});

}

if(m.image){

content.push({
type:"image_url",
image_url:{
url:m.image
}
});

}

apiMessages.push({
role:"user",
content:content
});

}else{

apiMessages.push({
role:"assistant",
content:m.content
});

}

}

const res=await fetch(
"/api/chat",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
messages:apiMessages
})
}
);

const data=await res.json();

thinking.remove();

const answer=
data.reply ||
data.error ||
"Infinity AI couldn't answer.";

current.messages.push({
role:"assistant",
content:answer
});

save();

renderChat();

}catch(error){

thinking.remove();

addMessage(
"ai",
"Infinity AI couldn't reach its AI server."
);

}finally{

btn.disabled=false;

btn.textContent="➤";

input.focus();

}

}

document.getElementById("input")
.addEventListener("keydown",function(e){

if(e.key==="Enter"&&!e.shiftKey){

e.preventDefault();

send();

}

});

renderSidebar();
renderChat();

</script>

</body>
</html>
